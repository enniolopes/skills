name: Branding Studio checks

on:
  pull_request:
    paths:
      - "skills/branding-studio/**"
      - "development/branding-studio/**"
      - "docs/branding-studio/**"
      - ".github/workflows/branding-studio.yml"
      - ".gitignore"
  push:
    branches: [main]
    paths:
      - "skills/branding-studio/**"
      - "development/branding-studio/**"
      - "docs/branding-studio/**"
      - ".github/workflows/branding-studio.yml"
      - ".gitignore"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile runtime and development Python
        run: python -m compileall -q skills/branding-studio/scripts development/branding-studio
      - name: Run unit tests
        run: python -m unittest discover -s development/branding-studio/tests -v
      - name: Build installable runtime bundle
        run: python development/branding-studio/package_skill.py /tmp/branding-studio.zip
