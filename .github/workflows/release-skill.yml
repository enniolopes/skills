name: release skill

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
  workflow_dispatch:
    inputs:
      skill:
        description: "Standalone skill directory name under skills/"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Releases must be created from main, got $GITHUB_REF" >&2
            exit 1
          }

      - name: Validate repository
        run: python development/validate.py

      - name: Select skills
        id: select
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SKILL: ${{ inputs.skill }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SKILLS="$INPUT_SKILL"
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            SKILLS=$(git ls-tree -r --name-only "$GITHUB_SHA" -- skills \
              | awk -F/ '$1 == "skills" && NF >= 2 {print $2}' \
              | sort -u)
          else
            SKILLS=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- skills \
              | awk -F/ '$1 == "skills" && NF >= 2 {print $2}' \
              | sort -u)
          fi

          test -n "$SKILLS" || {
            echo "No standalone skill selected or changed" >&2
            exit 1
          }

          printf 'skills<<EOF\n%s\nEOF\n' "$SKILLS" >> "$GITHUB_OUTPUT"

      - name: Preflight releases
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLS: ${{ steps.select.outputs.skills }}
        run: |
          for SKILL in $SKILLS; do
            [[ "$SKILL" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
              echo "Invalid skill name: $SKILL" >&2
              exit 1
            }
            test -f "skills/$SKILL/SKILL.md" || {
              echo "Unknown standalone skill: $SKILL" >&2
              exit 1
            }

            VERSION=$(SKILL="$SKILL" python - <<'PY'
          import os
          from pathlib import Path
          from development.validate import frontmatter

          skill = os.environ["SKILL"]
          version = frontmatter(Path("skills") / skill / "SKILL.md").get("metadata.version", "")
          if not version:
              raise SystemExit(f"skills/{skill}/SKILL.md has no metadata.version")
          print(version)
          PY
            )
            TAG="$SKILL-v$VERSION"

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists. Bump metadata.version before changing runtime." >&2
              exit 1
            fi
          done

      - name: Build and publish releases
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLS: ${{ steps.select.outputs.skills }}
        run: |
          for SKILL in $SKILLS; do
            VERSION=$(SKILL="$SKILL" python - <<'PY'
          import os
          from pathlib import Path
          from development.validate import frontmatter

          skill = os.environ["SKILL"]
          print(frontmatter(Path("skills") / skill / "SKILL.md")["metadata.version"])
          PY
            )
            TAG="$SKILL-v$VERSION"
            ASSET="$SKILL-$VERSION.zip"

            git archive \
              --format=zip \
              --prefix="$SKILL/" \
              --output="$ASSET" \
              HEAD:"skills/$SKILL"
            sha256sum "$ASSET" > "$ASSET.sha256"

            gh release create "$TAG" \
              "$ASSET" "$ASSET.sha256" \
              --target "$GITHUB_SHA" \
              --title "$SKILL v$VERSION" \
              --notes "Portable Agent Skill archived from \`skills/$SKILL/\` at \`$GITHUB_SHA\`. The repository directory remains the source of truth."
          done
